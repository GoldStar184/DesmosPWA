<!DOCTYPE HTML>
<html style="height: 100%; width: 100%; margin: 0; padding: 0;">
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="https://www.desmos.com/assets/img/apps/graphing/favicon.ico">
        <link rel="apple-touch-icon" href="https://www.desmos.com/apple-touch-icon.png">
        <title>Desmos PWA [IN PROGRESS]</title>
        <script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=fd0fac42e3fc4fbeaf59459b0c37f0da"></script>
    </head>
    <body>
        <div id="calculator" style="position: fixed; left:0; top:0; right:0; bottom:0;"></div>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("service-worker.js")
                    .then(reg => console.log("Registered service worker", reg))
                    .catch(err => console.error("Service worker error:", err));
            }
            var elt = document.getElementById('calculator');
            var calculator = Desmos.GraphingCalculator(elt, {
                actions: true,
                enableRepeatFunction: true,
                showEvaluationCopyButtons: true,
                pasteGraphLink: true,
                border: false
            });
            calculator.setExpression({
                type: 'text',
                text: 'This is an attempt at a PWA implementation of the desmos.com graphing calculator by @GoldStar184.\nTo import a graph paste the desmos URL in an expression field.\nThis tool is not affiliated with Desmos.'
            });
            calculator.setExpression({
                type: 'text',
                text: 'THIS IMPLEMENTATION IS IN PROGRESS AND DOES NOT WORK YET!'
            });
            // Request persistent storage for site
            if (navigator.storage && navigator.storage.persist) {
                const isPersisted = await navigator.storage.persisted();
                if (!isPersisted){
                    isPersisted = await navigator.storage.persist();
                } 
                console.log(`Persisted storage granted: ${isPersisted}`);
            }
        </script>
    </body>
</html>
