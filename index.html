<!DOCTYPE HTML>
<html style="height: 100%; width: 100%; margin: 0; padding: 0;">
    <head>
        <script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=fd0fac42e3fc4fbeaf59459b0c37f0da"></script>
        <title>Desmos PWA [IN PROGRESS]</title>
    </head>

    <body>
        <div id="calculator" style="position: fixed; left:0; top:0; right:0; bottom:0;"></div>
        <script>
            var elt = document.getElementById('calculator');
            var calculator = Desmos.GraphingCalculator(elt, {authorFeatures: true, actions: true, enableRepeatFunction: true, showEvaluationCopyButtons: true, pasteGraphLink: true, border: false});  
            calculator.setExpression({
                type: 'text',
                text: 'This is an attempt at a PWA implementation of the desmos.com graphing calculator by @GoldStar184. \nTo import a graph paste in the desmos URL in an expression field \nThis tool does not let you save graphs, plese have all expressions saved somewhere before closing.'
            });
            calculator.setExpression({
                type: 'text',
                text: 'THIS IMPLEMANTATION IS IN PROGRESS AND DOES NOT WORK YET!'
            });
        </script>
    </body>
</html>
